name: Docker CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - app/**
  pull_request:
    branches: [ main ]
    paths:
      - app/**

jobs:
  build:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    steps: 
      # 1
      - uses: actions/checkout@v4
      # 2  
      - name: Login to Docker Hub
        uses: docker/login-action@v3 
        with:
          username: ${{ secrets.DHUB_USER }}
          password: ${{ secrets.DHUB_TOKEN }}
      # 3   
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true 
          tags: ${{ secrets.DHUB_USER }}/api-garcialanza:latest

  aws:
    name: Deploy image to AWS
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # 1
    - name: Copy compose.yml via SSH key  
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_IP }}
        username: ${{ secrets.EC2_USER }}
        port: 22 # ${{ secrets.PORT }}
        key: ${{ secrets.EC2_KEY }}
        source: "compose.yml"
        target: /home/admin
    # 2
    - name: Script deploy Docker services 
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_IP }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: 22  # ${{ secrets.PORT }}
        script: |
            sleep 30
            docker compose down --rmi all
            docker compose up -d
